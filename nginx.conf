# Runs inside each existing frontend Pod. No certificate or private key here.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}

map $http_origin $backend_origin {
    default $http_origin;
    "https://coala.jbnu.ac.kr" "";
}

upstream coala_backend {
    # Short service name resolves in the frontend Pod's own namespace.
    server coala-backend-active:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $original_scheme;
    proxy_set_header Connection "";
    proxy_set_header Origin $backend_origin;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;

    location = /api {
        proxy_pass http://coala_backend;
    }
    location ^~ /api/ {
        proxy_pass http://coala_backend;
    }
    location ^~ /media/ {
        proxy_pass http://coala_backend;
    }

    location ~ (^|/)\. {
        return 404;
    }
    location ~* \.(?:pem|key|p12|pfx|conf|bak|old|orig|swp)$ {
        return 404;
    }

    location = /recruiting {
        rewrite ^ /index.html last;
    }
    location = /recruiting/ {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /og-coala-forest.png {
        expires -1;
    }
    location = /og-image.png {
        expires -1;
    }
    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location = /config/runtime.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location = /assets/ {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
